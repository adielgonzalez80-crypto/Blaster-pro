<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Demo — Necesidad de Asfalto Carbón</title>
<script src="./demo-asfalto/three.min.js"></script>
<script>
if(typeof THREE==="undefined"){
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
}
</script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body.race *{touch-action:none}
#ui,#ui *{touch-action:manipulation}
html,body{margin:0;height:100%;background:#07090d;color:#eef3ff;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 10px 0;pointer-events:none;z-index:3;display:none}
body.race #hud{display:block}
#top{display:flex;gap:8px;justify-content:space-between}
.box{background:rgba(8,10,16,.82);border:1px solid #3a4a68;border-radius:10px;padding:6px 10px;min-width:68px}
.lab{font-size:10px;letter-spacing:.1em;color:#9bb0d0}
.val{font-size:18px;font-weight:700}
#pads{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:4}
body.race #pads{display:flex}
#topPads{position:fixed;left:0;right:0;top:58px;display:none;justify-content:center;gap:8px;z-index:4;pointer-events:auto}
body.race #topPads{display:flex}
#topPads .pad{min-width:88px}
.col{display:flex;gap:6px}
.pad{min-width:64px;height:50px;border:1px solid #5a6a88;background:rgba(10,14,22,.9);color:#fff;border-radius:12px}
#nitro{background:#7a2a12;border-color:#d46a2a}
#sys{position:fixed;right:8px;top:calc(108px + env(safe-area-inset-top));display:none;flex-direction:column;gap:6px;z-index:6}
body.race #sys{display:flex}
#sys .pad{min-width:92px;height:40px;font-size:12px;font-weight:700}
#count{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:70px;z-index:5;text-shadow:0 4px 0 #000;opacity:0}
#count.on{opacity:1}
#intro{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center}
#intro video,#intro img{max-width:100%;max-height:100%;object-fit:contain}
#intro img{display:none;width:92%}
#intro.logo video{display:none}
#intro.logo img{display:block}
#intro.done{display:none}
#ui{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;color:#e8eef8;
background:#071018 url(demo-asfalto/img/menu-bg.jpg) center/cover no-repeat}
#ui:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05070cd9 8%,#05070c88 55%,#05070cd0);
pointer-events:none}
#ui.hide{display:none}
#ui .wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:10px 16px calc(8px + env(safe-area-inset-bottom));overflow:auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.brand small{display:block;letter-spacing:.22em;font-size:10px;color:#9bb4d0}
.brand h1{margin:2px 0 0;font-size:34px;letter-spacing:.04em;font-style:italic}
.brand h1 span{color:#e10600}
.meta{color:#c5d4e8;font-size:13px;max-width:46%}
.badge{border:1px solid #3a6aa0;background:linear-gradient(90deg,#123050,#0a1a2c);color:#fff;padding:8px 14px;font-size:11px;letter-spacing:.14em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.lab2{margin:10px 0 6px;font-size:12px;letter-spacing:.18em;color:#d6e4f5}
.lab2:before{content:"// ";color:#3aa0ff}
.row{display:flex;gap:8px;overflow:visible;padding-bottom:4px}
.card{flex:1 1 0;min-width:0;border:1px solid #2a4a6a;background:#0b1520cc;border-radius:6px;padding:0;color:#eef3ff;text-align:left;overflow:hidden}
.card.on{border-color:#f0c14b;box-shadow:0 0 0 2px #f0c14b,0 0 16px #f0c14b66}
.thumb{height:78px;background:#111 center/cover no-repeat}
.card b{display:block;padding:7px 8px;font-size:12px;background:#081018;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
.btn{border:0;background:#e10600;color:#fff;padding:12px 26px;border-radius:4px;font-weight:800}
.ghost{border:1px solid #3a6aa0;background:#0b1520;color:#eef3ff;padding:10px 16px;border-radius:4px}
@media (max-width:820px){
  .brand h1{font-size:24px}
  .thumb{height:72px}
  .meta{display:none}
}
</style>
</head>
<body>
<div id="intro"><video id="introVid" playsinline webkit-playsinline muted autoplay></video><img id="introLogo" alt="logo" src="demo-asfalto/img/logo-asfalto.png"/></div>
<div id="hud">
  <div id="top">
    <div class="box"><div class="lab">KM/H</div><div class="val" id="spd">0</div></div>
    <div class="box"><div class="lab">POS</div><div class="val" id="pos">4/4</div></div>
    <div class="box"><div class="lab">VUELTA</div><div class="val" id="lap">1/3</div></div>
    <div class="box"><div class="lab">NITRO</div><div class="val" id="nit">100</div></div>
  </div>
</div>
<div id="count"></div>
<div id="topPads">
  <button class="pad" data-k="gas">ACELERAR</button>
  <button class="pad" data-k="brake">FRENO</button>
  <button class="pad" id="nitro" data-k="nitro">NITRO</button>
</div>
<div id="pads">
  <div class="col">
    <button class="pad" data-k="left">◀</button>
    <button class="pad" data-k="right">▶</button>
  </div>
</div>
<div id="sys">
  <button class="pad" id="reiniciar" type="button">REINICIAR</button>
  <button class="pad" id="salirCarrera" type="button">SALIR</button>
</div>
<div id="ui">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <small>MEDIAMAX · MOTOR 3D THREE.JS</small>
        <h1>ASFALTO <span>CARBON</span> <small style='font-size:12px;color:#9cf'>v2 menú</small></h1>
        <div class="meta" id="msg">Selecciona tu auto. Cada carrera son 3 vueltas.</div>
      </div>
      <div class="badge">SELECCIÓN DE VEHÍCULOS</div>
    </div>
    <div class="lab2">PISTAS</div>
    <div class="row" id="tracks">
      <button class="card on" data-i="0" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/track-noche.jpg)"></div><b>Autódromo noche</b></button>
      <button class="card" data-i="1" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/track-desierto.jpg)"></div><b>Circuito desierto</b></button>
      <button class="card" data-i="2" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/track-ciudad.jpg)"></div><b>Anillo ciudad</b></button>
      <button class="card" data-i="3" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/track-bosque.jpg)"></div><b>Ruta bosque</b></button>
      <button class="card" data-i="4" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/track-costa.jpg)"></div><b>Pista costera</b></button>
    </div>
    <div class="lab2">AUTOS</div>
    <div class="row" id="cars">
      <button class="card on" data-i="0" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/gray.jpg)"></div><b>Spectrum 01 Gris</b></button>
      <button class="card" data-i="1" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/cyan.jpg)"></div><b>Spectrum 02 Azul</b></button>
      <button class="card" data-i="2" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/red.jpg)"></div><b>Spectrum 03 Rojo</b></button>
      <button class="card" data-i="3" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/black.jpg)"></div><b>Agama 01 Negro</b></button>
      <button class="card" data-i="4" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/green.jpg)"></div><b>Agama 02 Verde</b></button>
      <button class="card" data-i="5" type="button"><div class="thumb" style="background-image:url(demo-asfalto/img/gold.jpg)"></div><b>Agama 03 Amarillo</b></button>
    </div>
    <div class="dock">
      <button class="ghost" id="salir" type="button">B Atrás</button>
      <button class="btn" id="start" type="button">A Seleccionar</button>
    </div>
  </div>
</div>
<script>
(() => {
  const intro=document.getElementById("intro");
  const vid=document.getElementById("introVid");
  function showLogo(){
    if(!intro || intro.classList.contains("logo")) return;
    intro.classList.add("logo");
    setTimeout(function(){ intro.classList.add("done"); }, 2600);
  }
  if(vid){
    vid.src="demo-asfalto/img/intro-mediamax.mp4";
    vid.onended=showLogo;
    vid.onerror=showLogo;
    var pr=vid.play();
    if(pr && pr.catch) pr.catch(function(){});
    setTimeout(function(){ showLogo(); }, 9000);
    intro.addEventListener("click", function(){ if(vid.paused) vid.play().catch(function(){}); });
  }

  const CARS=[
    {id:"gray", name:"Spectrum 01 Gris", file:"demo-asfalto/img/gray.jpg", color:0x8e969e},
    {id:"cyan", name:"Spectrum 02 Azul", file:"demo-asfalto/img/cyan.jpg", color:0x2aa4e0},
    {id:"red", name:"Spectrum 03 Rojo", file:"demo-asfalto/img/red.jpg", color:0xc62828},
    {id:"black", name:"Agama 01 Negro", file:"demo-asfalto/img/black.jpg", color:0x151515},
    {id:"green", name:"Agama 02 Verde", file:"demo-asfalto/img/green.jpg", color:0x43a047},
    {id:"gold", name:"Agama 03 Amarillo", file:"demo-asfalto/img/gold.jpg", color:0xd4a017}
  ];
  const TRACKS=[
    {id:"noche", name:"Autódromo noche", sky:0x0d1420, grass:0x152018, road:0x2a2d32, line:0xc9a227, curb:0xc81e1e,
      start:[[0,0,40],[-4,0,50],[4,0,50],[-4,0,60]], check:[0,0,-100]},
    {id:"desierto", name:"Circuito desierto", sky:0xc4a06a, grass:0xc2a06a, road:0x6b5a45, line:0xf0e6c8, curb:0xa85a20,
      start:[[0,0,40],[-4,0,50],[4,0,50],[-4,0,60]], check:[0,0,-100]},
    {id:"ciudad", name:"Anillo ciudad", sky:0x4a5560, grass:0x3a3f44, road:0x3a3d42, line:0xffffff, curb:0xf2c200,
      start:[[0,0,40],[-4,0,50],[4,0,50],[-4,0,60]], check:[0,0,-100]},
    {id:"bosque", name:"Ruta bosque", sky:0x6f8f6a, grass:0x2e6b32, road:0x3f4338, line:0xe8e8e8, curb:0x1b5e20,
      start:[[0,0,40],[-4,0,50],[4,0,50],[-4,0,60]], check:[0,0,-100]},
    {id:"costa", name:"Pista costera", sky:0x6eb4d6, grass:0x2a6b8a, road:0x4a4d52, line:0xffffff, curb:0xe8d48a,
      start:[[0,0,40],[-4,0,50],[4,0,50],[-4,0,60]], check:[0,0,-100]}
  ];

  let trackI=0, carI=0;
  document.querySelectorAll("#tracks .card").forEach(b=>{
    b.onclick=()=>{trackI=+b.dataset.i; document.querySelectorAll("#tracks .card").forEach(x=>x.classList.remove("on")); b.classList.add("on");};
  });
  document.querySelectorAll("#cars .card").forEach(b=>{
    b.onclick=()=>{carI=+b.dataset.i; document.querySelectorAll("#cars .card").forEach(x=>x.classList.remove("on")); b.classList.add("on");};
  });

  const hold={};
  document.querySelectorAll(".pad[data-k]").forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener("pointerdown",e=>{e.preventDefault();hold[k]=true;});
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>hold[k]=false));
  });
  addEventListener("keydown",e=>{
    if(["ArrowLeft","a","A"].includes(e.key))hold.left=true;
    if(["ArrowRight","d","D"].includes(e.key))hold.right=true;
    if(["ArrowDown","s","S"].includes(e.key))hold.brake=true;
    if(["ArrowUp","w","W"].includes(e.key))hold.gas=true;
    if(e.key===" "||e.key==="Shift")hold.nitro=true;
  });
  addEventListener("keyup",e=>{
    if(["ArrowLeft","a","A"].includes(e.key))hold.left=false;
    if(["ArrowRight","d","D"].includes(e.key))hold.right=false;
    if(["ArrowDown","s","S"].includes(e.key))hold.brake=false;
    if(["ArrowUp","w","W"].includes(e.key))hold.gas=false;
    if(e.key===" "||e.key==="Shift")hold.nitro=false;
  });

  let renderer, scene, camera, racers=[], player, theme, running=false, locked=true;
  const LAPS=3;
  const carTex={};
  function texFromImg(img){
    const t=new THREE.Texture(img);
    t.needsUpdate=true;
    t.minFilter=THREE.LinearFilter;
    t.magFilter=THREE.LinearFilter;
    return t;
  }
  CARS.forEach(c=>{
    const im=new Image();
    im.onload=()=>{ carTex[c.id]=texFromImg(im); };
    im.src=c.file;
  });

  function makeCar(spec, x,z, ai){
    const g=new THREE.Group();
    const col=spec.color||0x2aa4e0;
    const paint=new THREE.MeshBasicMaterial({color:col});
    const dark=new THREE.MeshBasicMaterial({color:0x141414});
    const glass=new THREE.MeshBasicMaterial({color:0x6d8798});
    const rub=new THREE.MeshBasicMaterial({color:0x111111});
    const mk=(geo,mat,px,py,pz)=>{const m=new THREE.Mesh(geo,mat); m.position.set(px,py,pz); g.add(m); return m;};
    mk(new THREE.BoxGeometry(1.8,0.38,4.1), paint, 0,0.48,0);
    mk(new THREE.BoxGeometry(1.65,0.22,1.5), paint, 0,0.72,0.85);
    mk(new THREE.BoxGeometry(1.55,0.42,1.6), paint, 0,0.88,-0.25);
    mk(new THREE.BoxGeometry(1.25,0.28,1.15), glass, 0,1.12,-0.15);
    mk(new THREE.BoxGeometry(1.7,0.14,0.9), paint, 0,0.40,1.85);
    mk(new THREE.BoxGeometry(1.55,0.22,0.55), paint, 0,0.50,-1.85);
    mk(new THREE.BoxGeometry(1.6,0.07,0.40), dark, 0,1.28,-1.70);
    mk(new THREE.BoxGeometry(0.07,0.28,0.28), dark, -0.55,1.12,-1.62);
    mk(new THREE.BoxGeometry(0.07,0.28,0.28), dark, 0.55,1.12,-1.62);
    mk(new THREE.BoxGeometry(0.95,0.08,0.06), new THREE.MeshBasicMaterial({color:0xff2a2a}), 0,0.52,-2.08);
    mk(new THREE.BoxGeometry(0.28,0.08,0.06), new THREE.MeshBasicMaterial({color:0xfff2c0}), -0.55,0.52,2.08);
    mk(new THREE.BoxGeometry(0.28,0.08,0.06), new THREE.MeshBasicMaterial({color:0xfff2c0}), 0.55,0.52,2.08);
    [[-1.02,0.28,1.25],[1.02,0.28,1.25],[-1.02,0.28,-1.30],[1.02,0.28,-1.30]].forEach(p=>{
      const w=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.22,16), rub);
      w.rotation.z=Math.PI/2; w.position.set(p[0],p[1],p[2]); g.add(w);
    });
    g.position.set(x,0,z);
    scene.add(g);
    return {mesh:g, spec, x,z, yaw:Math.PI, spd:0, nitro:100, dist:0, lap:1, ai, done:false, passed:false};
  }

  function buildTrack(t){
    theme=t;
    scene.background=new THREE.Color(t.sky);
    scene.fog=null;
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshBasicMaterial({color:t.grass}));
    floor.rotation.x=-Math.PI/2; floor.position.y=-0.02; scene.add(floor);
    const road=new THREE.Mesh(new THREE.PlaneGeometry(16,260), new THREE.MeshBasicMaterial({color:t.road}));
    road.rotation.x=-Math.PI/2; scene.add(road);
    for(let i=-12;i<=12;i++){
      const dash=new THREE.Mesh(new THREE.PlaneGeometry(0.28,4), new THREE.MeshBasicMaterial({color:t.line}));
      dash.rotation.x=-Math.PI/2; dash.position.set(0,0.02,i*10); scene.add(dash);
    }
    const curbL=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.22,260), new THREE.MeshBasicMaterial({color:t.curb}));
    curbL.position.set(-8.2,0.11,0); scene.add(curbL);
    const curbR=curbL.clone(); curbR.position.x=8.2; scene.add(curbR);
    if(t.id==="ciudad"){
      for(let i=-5;i<=5;i++){
        const h=6+((i*3)&7);
        const b1=new THREE.Mesh(new THREE.BoxGeometry(6,h,6), new THREE.MeshBasicMaterial({color:0x5a6270}));
        b1.position.set(-16,h/2,i*18); scene.add(b1);
        const b2=b1.clone(); b2.position.x=16; b2.scale.y=0.7+((i&3)*0.2); scene.add(b2);
      }
    }
    if(t.id==="bosque"){
      for(let i=-8;i<=8;i++){
        const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,3,6), new THREE.MeshBasicMaterial({color:0x5d4037}));
        tr.position.set(-12,1.5,i*12); scene.add(tr);
        const lf=new THREE.Mesh(new THREE.ConeGeometry(2.2,3.2,6), new THREE.MeshBasicMaterial({color:0x2e7d32}));
        lf.position.set(-12,4.2,i*12); scene.add(lf);
        const tr2=tr.clone(); tr2.position.x=12; scene.add(tr2);
        const lf2=lf.clone(); lf2.position.x=12; scene.add(lf2);
      }
    }
    if(t.id==="costa"){
      const water=new THREE.Mesh(new THREE.PlaneGeometry(180,260), new THREE.MeshBasicMaterial({color:0x1e6a9a}));
      water.rotation.x=-Math.PI/2; water.position.set(20,-0.01,0); scene.add(water);
    }
  }

  function reset(){
    if(renderer){ renderer.dispose(); document.body.querySelectorAll("canvas").forEach(c=>c.remove()); }
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(60, innerWidth/Math.max(1,innerHeight), 0.1, 400);
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    document.body.prepend(renderer.domElement);
    buildTrack(TRACKS[trackI]);
    const st=TRACKS[trackI].start;
    player=makeCar(CARS[carI], st[0][0], st[0][2], false);
    racers=[player];
    const others=CARS.filter((_,i)=>i!==carI).slice(0,3);
    others.forEach((c,i)=>{
      const s=st[i+1]||st[0];
      racers.push(makeCar(c,s[0],s[2],true));
    });
    running=true; locked=true;
    document.body.classList.add("race");
    countdown();
  }
  function countdown(){
    const el=document.getElementById("count"); const seq=["3","2","1","YA"];
    let i=0; el.classList.add("on"); el.textContent=seq[0];
    const t=setInterval(()=>{
      i++;
      if(i>=seq.length){ clearInterval(t); el.classList.remove("on"); locked=false; hold.gas=true; return; }
      el.textContent=seq[i];
    },650);
  }

  function hitWall(r){
    if(!theme||!theme.walls) return;
    for(const w of theme.walls){
      const hx=w[3]/2+1.2, hz=w[5]/2+1.2;
      if(Math.abs(r.x-w[0])<hx && Math.abs(r.z-w[2])<hz){
        r.spd*=0.4;
        const dx=r.x-w[0], dz=r.z-w[2];
        if(Math.abs(dx)/hx > Math.abs(dz)/hz) r.x += Math.sign(dx||1)*0.4;
        else r.z += Math.sign(dz||1)*0.4;
      }
    }
  }
  function stepCar(r, gas, steer, brake, nitro, dt){
    if(r.done||locked) return;
    let target = 0;
    if (brake) target = 0;
    else if (gas) target = (nitro && r.nitro>0) ? 40 : 28;
    r.spd += (target - r.spd) * Math.min(1, dt * (gas ? 1.8 : 1.1));
    if (brake) r.spd = Math.max(0, r.spd - 55*dt);
    if (!gas && !brake) r.spd = Math.max(0, r.spd - 10*dt);
    if(nitro&&r.nitro>0&&!r.ai) r.nitro=Math.max(0,r.nitro-26*dt);
    else r.nitro=Math.min(100,r.nitro+8*dt);
    r.yaw += steer * dt * (1.6 + r.spd*0.04);
    r.x += Math.sin(r.yaw)*r.spd*dt;
    r.z += Math.cos(r.yaw)*r.spd*dt;
    r.dist += r.spd*dt;
    hitWall(r);
    r.mesh.position.set(r.x,0,r.z);
    r.mesh.rotation.y=r.yaw;
    if(r.mesh.userData.wheels) r.mesh.userData.wheels.forEach(w=>w.rotation.x+=r.spd*dt);
    const ck=theme.check;
    const near=Math.hypot(r.x-ck[0], r.z-ck[2])<18;
    if(near && !r.passed) r.passed=true;
    if(!near && r.passed){ r.passed=false; r.lap=Math.min(LAPS,r.lap+1); if(r.lap>=LAPS && r.dist>80){ r.done=true; r.spd=0; if(r===player) finish(); } }
  }
  function ai(r,dt){
    const ck=theme.check;
    const want=Math.atan2(ck[0]-r.x, ck[2]-r.z);
    let d=want-r.yaw;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    stepCar(r,true, Math.max(-1,Math.min(1,d*1.5)), false,false,dt);
  }
  function finish(){
    running=false; document.body.classList.remove("race");
    const order=[...racers].sort((a,b)=>(b.lap-a.lap)||(b.dist-a.dist));
    document.getElementById("msg").textContent="Meta 3D. Quedaste "+(order.indexOf(player)+1)+" de 4.";
    document.getElementById("start").textContent="OTRA CARRERA";
    document.getElementById("ui").classList.remove("hide");
  }

  addEventListener("resize",()=>{
    if(!camera||!renderer) return;
    camera.aspect=innerWidth/Math.max(1,innerHeight);
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(running && player){
      if(!locked){
        const steer=(hold.left?1:0)+(hold.right?-1:0);
        stepCar(player, !!hold.gas, steer, hold.brake, hold.nitro, dt);
        racers.forEach(r=>{ if(r.ai) ai(r,dt); });
      }
      const back=6.4+player.spd*0.03, up=2.05;
      const side=2.4; const cx=player.x - Math.sin(player.yaw)*back + Math.cos(player.yaw)*side;
      const cz=player.z - Math.cos(player.yaw)*back - Math.sin(player.yaw)*side;
      camera.position.lerp(new THREE.Vector3(cx,up,cz), 0.12);
      camera.lookAt(player.x, 0.7, player.z);
      document.getElementById("spd").textContent=Math.floor(player.spd*7);
      document.getElementById("nit").textContent=Math.floor(player.nitro);
      document.getElementById("lap").textContent=player.lap+"/"+LAPS;
      const order=[...racers].sort((a,b)=>(b.lap-a.lap)||(b.dist-a.dist));
      document.getElementById("pos").textContent=(order.indexOf(player)+1)+"/4";
    }
    if(renderer&&scene&&camera) renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.getElementById("salir").onclick=()=>{ try{ if(window.Android&&Android.exitApp) Android.exitApp(); else location.reload(); }catch(e){ location.reload(); } };
  function doRestart(){
    running=false; locked=true;
    document.body.classList.add("race");
    document.getElementById("ui").classList.add("hide");
    reset();
  }
  function doExit(){
    running=false; locked=true;
    document.body.classList.remove("race");
    document.getElementById("ui").classList.remove("hide");
  }
  ["click","pointerup","touchend"].forEach(ev=>{
    document.getElementById("reiniciar").addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();doRestart();});
    document.getElementById("salirCarrera").addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();doExit();});
  });
  document.getElementById("start").onclick=()=>{
    if(typeof THREE==="undefined"){ document.getElementById("msg").textContent="No cargo el motor 3D. Reabre el archivo."; return; }
    document.getElementById("ui").classList.add("hide"); reset();
  };
})();
</script>
</body>
</html>
